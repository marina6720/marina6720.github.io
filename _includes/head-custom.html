{% if page.translation_url %}
  {% if page.lang == 'en' %}
<link rel="alternate" hreflang="ja" href="{{ page.translation_url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
  {% else %}
<link rel="alternate" hreflang="ja" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ page.translation_url | absolute_url }}">
  {% endif %}
{% endif %}

<!-- Favicon -->
<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">

<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">

<!-- iPhone / iPad ホーム画面用 -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-icon-180x180.png' | relative_url }}">

<!-- ブラウザ色 -->
<meta name="theme-color" content="#fffaf3">


<!-- ブラウザ色 -->
<meta name="theme-color" content="#fffaf3">

<!-- OGP / SNS共有用 -->
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">

<!-- X / Twitterカード -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">

{% if page.research_citation_title %}
<!-- Citation metadata for Q-authored research notes. Not a claim of journal publication. -->
<meta name="citation_title" content="{{ page.research_citation_title | escape }}">
<meta name="citation_author" content="{{ page.research_citation_author | escape }}">
<meta name="citation_date" content="{{ page.research_citation_date | escape }}">
{% endif %}
